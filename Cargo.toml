[package]
name = "allymailer-axum"
version = "1.0.0"
edition = "2021"
rust-version = "1.75"
description = "AllyMailer Web API for axum: API client from the environment, webhook endpoint"
license = "MIT"
repository = "https://github.com/allymailer/allymailer-axum"
documentation = "https://docs.allymailer.com.ua/ua/web-api-ref"
readme = "README.md"
keywords = ["allymailer", "axum", "email", "webhook"]
categories = ["api-bindings", "email", "web-programming::http-server"]

[lib]
name = "allymailer_wrapper"

[dependencies]
allymailer-rust-sdk = "1.0.0"
axum = { version = "0.7", default-features = false, features = ["tokio", "http1"] }
md-5 = "0.10"
serde_json = "1"
